services:
  # names are prefixed: the internal network is shared by every stack
  local-mystock-fpm:
    container_name: local-mystock-fpm
    build:
      context: .
    env_file: etc/config/local.env
    # with a dependency container stopped its name stops resolving, and musl waits 5s before failing;
    # the Redis/MySQL client timeouts don't cover DNS, so bound it here
    dns_opt:
      - timeout:1
      - attempts:1
    volumes:
      # live code for development; the image also ships its own copy
      - ./src:/var/www/src
      - ./database:/var/www/database
    networks:
      - internal

  local-mystock-nginx:
    container_name: local-mystock-nginx
    image: nginx:stable-alpine
    volumes:
      - ./etc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docs:/usr/share/nginx/docs:ro
    depends_on:
      - local-mystock-fpm
    networks:
      - internal
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.mystock.entrypoints=http"
      - "traefik.http.routers.mystock.rule=Host(`mystock.cloud.local`)"
      - "traefik.http.middlewares.mystock-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.mystock.middlewares=mystock-https-redirect"
      - "traefik.http.routers.mystock-secure.rule=Host(`mystock.cloud.local`)"
      - "traefik.http.routers.mystock-secure.entrypoints=https"
      - "traefik.http.routers.mystock-secure.tls=true"
      - "traefik.http.services.mystock.loadbalancer.server.port=8080"

networks:
  internal:
    external: true
  traefik-proxy:
    external: true
