openapi: 3.1.0
info:
  title: MyStock API
  version: 1.0.0
  description: Product catalog used to practice caching (cache-aside with Redis) on top of MySQL.
servers:
  - url: /api
tags:
  - name: health
  - name: products
paths:
  /health:
    get:
      tags: [health]
      summary: MySQL and Redis status
      responses:
        "200":
          description: every dependency answered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: at least one dependency failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /products:
    get:
      tags: [products]
      summary: Paginated list, ordered by name
      parameters:
        - name: category
          in: query
          schema: { type: string, example: category-01 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: one page of products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [products]
      summary: One product
      responses:
        "200":
          description: the product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [products]
      summary: Change price and/or stock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductChanges" }
      responses:
        "200":
          description: the updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  schemas:
    Product:
      type: object
      required: [id, sku, name, category, price_cents, stock, updated_at]
      properties:
        id: { type: integer, example: 1 }
        sku: { type: string, example: SKU-000001 }
        name: { type: string, example: Product 000001 }
        category: { type: string, example: category-02 }
        price_cents: { type: integer, minimum: 0, example: 8019 }
        stock: { type: integer, minimum: 0, example: 229 }
        updated_at: { type: string, example: "2026-10-08 12:00:00" }
    ProductPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    ProductChanges:
      type: object
      description: send price_cents and/or stock
      minProperties: 1
      properties:
        price_cents: { type: integer, minimum: 0 }
        stock: { type: integer, minimum: 0 }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, error] }
        checks:
          type: object
          properties:
            mysql: { type: string, enum: [ok, error] }
            redis: { type: string, enum: [ok, error] }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: invalid parameter or body
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: product not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
