openapi: 3.1.0
info:
  title: MyStock API
  version: 1.0.0
  description: Product catalog used to practice caching (cache-aside with Redis) on top of MySQL.
servers:
  - url: /api
tags:
  - name: health
  - name: auth
  - name: products
paths:
  /health:
    get:
      tags: [health]
      summary: MySQL and Redis status
      security: []
      responses:
        "200":
          description: every dependency answered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: at least one dependency failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /auth/register:
    post:
      tags: [auth]
      summary: Create a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: user created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/login:
    post:
      tags: [auth]
      summary: Get a JWT valid for 1 hour
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: logged in
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /products:
    get:
      tags: [products]
      summary: Paginated list, ordered by name
      security: []
      parameters:
        - name: category
          in: query
          schema: { type: string, example: category-01 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: one page of products
          headers:
            X-Cache: { $ref: "#/components/headers/XCache" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [products]
      summary: One product
      security: []
      responses:
        "200":
          description: the product
          headers:
            X-Cache: { $ref: "#/components/headers/XCache" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [products]
      summary: Change price and/or stock
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductChanges" }
      responses:
        "200":
          description: the updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  headers:
    XCache:
      description: HIT when the response came from Redis, MISS when it was read from MySQL (and then cached)
      schema: { type: string, enum: [HIT, MISS] }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254, example: ana@example.com }
        password: { type: string, minLength: 8, example: secret123 }
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: integer, example: 1 }
        email: { type: string, example: ana@example.com }
    Product:
      type: object
      required: [id, sku, name, category, price_cents, stock, updated_at]
      properties:
        id: { type: integer, example: 1 }
        sku: { type: string, example: SKU-000001 }
        name: { type: string, example: Product 000001 }
        category: { type: string, example: category-02 }
        price_cents: { type: integer, minimum: 0, example: 8019 }
        stock: { type: integer, minimum: 0, example: 229 }
        updated_at: { type: string, example: "2026-10-08 12:00:00" }
    ProductPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    ProductChanges:
      type: object
      description: send price_cents and/or stock
      minProperties: 1
      properties:
        price_cents: { type: integer, minimum: 0 }
        stock: { type: integer, minimum: 0 }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, error] }
        checks:
          type: object
          properties:
            mysql: { type: string, enum: [ok, error] }
            redis: { type: string, enum: [ok, error] }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: invalid parameter or body
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: missing, invalid or expired token / invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: product not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
