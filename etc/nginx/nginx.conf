worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;
        # relative Location: behind Traefik, nginx doesn't know the public host/scheme/port
        absolute_redirect off;

        # everything under /api goes to the front controller; the rest of the path is PATH_INFO
        location ~ ^/api(?<path_info>/.*)?$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/src/index.php;
            fastcgi_param PATH_INFO $path_info;
            fastcgi_pass local-mystock-fpm:9000;
        }

        # Swagger UI + OpenAPI spec, static files from docs/
        location = / {
            return 302 /docs/;
        }

        location = /docs {
            return 301 /docs/;
        }

        location /docs/ {
            alias /usr/share/nginx/docs/;
            types {
                text/html html;
                application/yaml yaml;
            }
        }

        location / {
            default_type application/json;
            return 404 '{"error":"Not Found"}';
        }
    }
}
